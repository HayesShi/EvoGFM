  metric_pairing: Random/Hard and AUC/AP share the same selected support seed
  protocols:
    mixed:
      table: Table 4
      seeds:
        chameleon: 46
        cora: 40
        computers: 43
        squirrel: 40
    random:
      table: Table A1
      seeds:
        chameleon: 41
