        computers: 47
continual:
  candidate_seeds:
  - 42
  - 43
  - 44
  execution: reuse completed runs; no new training
  arrival_order:
    selection_metric: 20-shot mean NC transfer gain across all ten recipient graphs
    seeds:
      stream_random: 42
      stream_domain_grouped: 44
      stream_spectral_grouped: 42
      stream_interleaved: 44
  supervision:
    selection_metric: Joint 20-shot NC transfer gain
    paired_tables:
    - Table 6
    - Table 6(b)
    - Table A2
    - Table A6
    pairing: all supervision arms, NC/LP and readout variants use the same seed per
      target
    seeds:
      twitch-en: 43
      twitch-de: 42
      twitch-fr: 43
      github-developer: 44
  retention:
    selection_metric: Random-order EvoGFM first-four-graph retention gain, prefix
      4 to 15
    seed: 43
    baseline_seed_policy: same seed for EvoGFM and GraphKeeper
