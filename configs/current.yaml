analysis: best_observed_seed
selection:
  model: EvoGFM
  metric: observed_test_accuracy_percent
  candidate_seeds:
  - 42
  - 43
  - 44
  unit:
  - dataset
  - shots
  direction: maximize
  tie_break: smallest_seed
  baseline_seed_policy: same_seed_as_selected_EvoGFM
  report: single_seed_accuracy_without_standard_deviation
  interpretation: Exploratory selection on observed test results; not a multi-seed
    mean or an independent test estimate.
