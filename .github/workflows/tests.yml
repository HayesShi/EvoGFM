name: Tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,plots]"
      - run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/HayesShi/EvoGFM/9ced8199f221521d20ceab168974803542dc4574/checkpoints/reference.pt --output checkpoints/reference.pt
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m pytest -q
