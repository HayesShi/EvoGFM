[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evogfm"
version = "0.1.0"
description = "Graph-conditioned inverse attention with task calibration"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5,<2.7",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "torch-geometric==2.6.1",
    "tqdm>=4.66,<5",
    "pandas>=2,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "black==25.1.0", "ruff>=0.9,<1"]
benchmarks = ["psutil>=5.9,<8", "threadpoolctl>=3.1,<4", "einops>=0.6,<1", "omegaconf>=2.3,<3"]
scgfm = ["POT==0.9.7.post1"]

[tool.setuptools.packages.find]
include = ["evogfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F"]
